# For developing Serena itself. To use Serena with your own project, see examples/docker/.
services:
  serena:
    image: serena:dev
    pull_policy: build
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:${SERENA_DASHBOARD_PORT:-24282}:24282"  # Dashboard port (default 0x5EDA = 24282)
    volumes:
      - ${PROJECT_DIR:-.}:/workspace/
